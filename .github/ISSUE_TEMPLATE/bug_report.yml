name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: deploy-mode
    attributes:
      label: Deployment mode
      options:
        - Docker Compose
        - Local dev (npm run dev)
        - Both
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Console / container logs. Redact any secrets and API keys.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or commit sha
  - type: textarea
    id: context
    attributes:
      label: Additional context
